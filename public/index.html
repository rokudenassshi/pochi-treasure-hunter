<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ポチポチ秘宝ハンター</title>
  <link id="appStylesheet" rel="stylesheet" href="" />
  <script>
    document.write(
      `<script src="js/version.js?t=${Date.now()}"><\/script>`,
    );
  </script>
  <script>
    (function () {
      const version = window.GameVersion || "dev";
      const assetVersion = encodeURIComponent(version);
      const storageKey = "clicker_hackslash_asset_version";
      const previousVersion = localStorage.getItem(storageKey);
      const params = new URLSearchParams(window.location.search);
      const reloadMarker = params.get("_appv");

      window.GameVersion = version;

      document.getElementById("appStylesheet").href =
        `css/style.css?v=${assetVersion}`;

      if (
        previousVersion &&
        previousVersion !== assetVersion &&
        reloadMarker !== assetVersion
      ) {
        localStorage.setItem(storageKey, assetVersion);
        params.set("_appv", assetVersion);
        const query = params.toString();
        window.location.replace(
          `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`,
        );
        return;
      }

      localStorage.setItem(storageKey, assetVersion);
    })();
  </script>
</head>

<body>
  <div class="app">
    <section class="panel battle-panel">
      <div class="topbar">
        <div class="stat-card">
          <div class="label">階層</div>
          <div id="floorValue" class="value">1F</div>
        </div>
        <div class="stat-card">
          <div class="label">ゴールド</div>
          <div id="goldValue" class="value">0</div>
        </div>
        <div class="stat-card">
          <div class="label">DPS</div>
          <div id="dpsValue" class="value">0</div>
        </div>
      </div>

      <div id="enemyArea" class="enemy-area">
        <button id="enemyButton" class="enemy" aria-label="敵を攻撃"></button>
      </div>

      <div class="hpbar">
        <div id="hpFill" class="hpfill"></div>
      </div>
      <div class="hptext">
        <span id="hpText">0 / 0</span>
        <span id="timerText">--</span>
      </div>
      <div class="subline">
        <span id="tapInfo">攻撃力: 1</span>
        <span id="critInfo">会心率 5%</span>
      </div>
      <div class="battle-actions">
        <button id="challengeBossBtn" class="btn warn" style="display:none;">ボスに挑戦</button>
        <button id="escapeBossBtn" class="btn danger" style="display:none;">逃げる</button>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="upgrade">強化</button>
      <button class="tab-btn" data-tab="party">仲間</button>
      <button class="tab-btn" data-tab="equip">道具</button>
      <button class="tab-btn" data-tab="record">記録</button>
    </nav>

    <section id="screen-battle" class="screen panel">
      <div class="section-title">戦闘ログ</div>
      <div id="log" class="log"></div>
    </section>

    <section id="screen-upgrade" class="screen active panel">
      <div class="section-title">プレイヤー強化</div>
      <div class="list">
        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="item-name">攻撃力</div>
              <div id="tapDescriptionText" class="small">攻撃力が 1 増加</div>
            </div>
            <div id="tapLevelText" class="small">Lv.1</div>
          </div>
          <div class="actions">
            <button id="buyTapBtn" class="btn primary">強化</button>
            <button id="maxTapBtn" class="btn">Max</button>
            <div id="buyTapCost" class="small"></div>
          </div>
        </div>

        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="item-name">会心率</div>
              <div id="critDescriptionText" class="small">会心率が 1% 増加</div>
            </div>
            <div id="critLevelText" class="small">Lv.0</div>
          </div>
          <div class="actions">
            <button id="buyCritBtn" class="btn primary">強化</button>
            <button id="maxCritBtn" class="btn">Max</button>
            <div id="buyCritCost" class="small"></div>
          </div>
        </div>

        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="item-name">会心威力</div>
              <div id="critDmgDescriptionText" class="small">会心威力が 1% 増加</div>
            </div>
            <div id="critDmgLevelText" class="small">Lv.0</div>
          </div>
          <div class="actions">
            <button id="buyCritDmgBtn" class="btn primary">強化</button>
            <button id="maxCritDmgBtn" class="btn">Max</button>
            <div id="buyCritDmgCost" class="small"></div>
          </div>
        </div>

        <div class="row-card">
          <div class="row-top">
            <div>
              <div class="item-name">次のダンジョンへ行く</div>
              <div id="rebirthDescriptionText" class="small">50Fごとに秘宝+1、150F/250Fごとに追加+1</div>
            </div>
          </div>
          <div class="actions">
            <button id="rebirthBtn" class="btn warn" data-rebirth="1" disabled>次のダンジョンへ行く</button>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-party" class="screen panel">
      <div class="panel-inner-gap">
        <div class="section-title">仲間一覧</div>
        <div class="small">仲間を雇うと自動で敵を攻撃します。ここでパーティーレベルを強化できます。</div>
        <div id="allyList" class="list mt8"></div>
      </div>
    </section>

    <section id="screen-equip" class="screen panel">
      <div class="item-subtabs">
        <button class="item-tab-btn active" data-item-tab="equip">装備</button>
        <button class="item-tab-btn" data-item-tab="treasure">秘宝</button>
      </div>

      <div id="item-tab-equip" class="item-pane active">
        <div class="panel-inner-gap">
          <div class="section-title">装備中</div>
          <div class="equip-slots">
            <div id="gogglesSlot" class="row-card"></div>
            <div id="compassSlot" class="row-card"></div>
          </div>
        </div>
        <div id="itemSettingsSection" class="panel-inner-gap"></div>
        <div class="panel-inner-gap">
          <div class="section-title">所持装備</div>
          <div id="inventoryList" class="list"></div>
        </div>
      </div>

      <div id="item-tab-treasure" class="item-pane">
        <div class="section-title">秘宝</div>
        <div class="row-card small">まだ秘宝を持っていません。</div>
      </div>
    </section>

    <section id="screen-record" class="screen panel">
      <div class="item-subtabs">
        <button class="item-tab-btn record-tab-btn active" data-record-tab="record">記録</button>
        <button class="item-tab-btn record-tab-btn" data-record-tab="settings">設定</button>
      </div>

      <div id="record-tab-record" class="item-pane active">
        <div class="section-title section-title-inline"><span>記録</span><span id="recordVersionText"
            class="section-title-meta"></span></div>
        <div id="statusList" class="list"></div>
      </div>

      <div id="record-tab-settings" class="item-pane">
        <div class="section-title">設定</div>
        <div id="recordSettingsList" class="list"></div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const assetVersion = encodeURIComponent(
        window.GameVersion || "dev",
      );
      const params = new URLSearchParams(window.location.search);
      if (params.get("_appv") === assetVersion) {
        params.delete("_appv");
        const query = params.toString();
        window.history.replaceState(
          null,
          "",
          `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`,
        );
      }

      const scripts = [
        "js/config.js",
        "js/state.js",
        "js/items.js",
        "js/enemies.js",
        "js/allies.js",
        "js/battle.js",
        "js/ui.js",
        "js/rebirth.js",
        "js/save-reset.js",
        "js/main.js",
      ];

      function loadScript(index) {
        if (index >= scripts.length) return;
        const script = document.createElement("script");
        script.src = `${scripts[index]}?v=${assetVersion}`;
        script.async = false;
        script.onload = () => loadScript(index + 1);
        document.body.appendChild(script);
      }

      loadScript(0);
    })();
  </script>
</body>

</html>
